name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Test Windows installer with mocked registry and WSL
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-installer.test.ps1
  linux-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3 xvfb xauth x11-utils xdotool wmctrl xfwm4 dbus xclip scrot imagemagick libglib2.0-bin util-linux fonts-dejavu-core build-essential libx11-dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
        env:
          FECIMUS_DATA_DIR: ${{ runner.temp }}/fecimus-test-data
